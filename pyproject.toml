[project]
name = "fpga-autopilot"
version = "1.0.0"
description = "Digital Design & Quartus II Autopilot (SystemVerilog + Self-Checking TB + GUI Inspection + LaTeX Report)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "opencv-python>=4.8",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "pillow>=10.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]
